name: Quality and browser smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, and Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        run: npm test

  browser-smoke:
    name: Local Supabase and Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start ephemeral local Supabase
        id: supabase
        run: |
          supabase start
          supabase db reset --local
          supabase migration list --local > migration-list.txt
          grep -q "202608190003" migration-list.txt

      - name: Configure local frontend environment
        run: |
          supabase status -o env > supabase-local.env
          API_URL=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' supabase-local.env)
          ANON_KEY=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' supabase-local.env)
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$ANON_KEY"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.local
          rm supabase-local.env

      - name: Bootstrap deterministic local fixtures
        run: npm run local:bootstrap
        env:
          PRONOUNCELAB_SUPABASE_CLI: supabase

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Vite and wait for readiness
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &
          echo $! > vite.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Vite did not become ready at http://127.0.0.1:5173/" >&2
          cat vite.log >&2
          exit 1

      - name: Run Chromium smoke tests
        run: npm run test:smoke

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Print local service diagnostics
        if: failure()
        run: |
          echo "Local Supabase containers:"
          docker ps -a --filter name=supabase_ --format 'table {{.Names}}\t{{.Status}}'
          echo "Vite log:"
          if [ -f vite.log ]; then tail -n 200 vite.log; else echo "Vite was not started."; fi

      - name: Stop local services
        if: always()
        run: |
          if [ -f vite.pid ]; then kill "$(cat vite.pid)" 2>/dev/null || true; fi
          supabase stop --no-backup || true
